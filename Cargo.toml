[package]
name = "xpaint"
version = "0.2.1"
edition = "2024"
license = "MIT"

[dependencies]
ab_glyph = "0.2"
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
eframe = { version = "0.37.0", features = ["persistence"] }
egui = "0.37"
egui_extras = { version = "0.37", features = ["svg"] }
image = "0.25.10"
rfd = "0.17.2"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }

# Decode images fast even in debug builds
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
strip = "debuginfo"

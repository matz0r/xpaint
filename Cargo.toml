[package]
name = "xpaint"
version = "0.6.0"
edition = "2024"
license = "MIT"

[dependencies]
ab_glyph = "0.2"
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
eframe = { version = "0.37.0", features = ["persistence"] }
egui = "0.37"
egui_extras = { version = "0.37", features = ["svg"] }
image = "0.25.10"
rfd = "0.17.2"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
semver = "1"

# Update check and download from GitHub releases (installed copy only).
# rustls with bundled roots: no OpenSSL needed at runtime.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Unpacks the release archive for the update: .tar.gz on Linux, .zip on Windows
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4.46", default-features = false }

[target.'cfg(windows)'.dependencies]
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# AttachConsole, so the command-line modes print to the terminal they were started from
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[build-dependencies]
# Embeds the icon in xpaint.exe (only when building for Windows)
winresource = { version = "0.1", default-features = false }

# Decode images fast even in debug builds
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
strip = "debuginfo"

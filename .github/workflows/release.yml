# Builds xpaint for Linux and Windows when a version tag (e.g. v0.2.0) is pushed and
# publishes both as a GitHub release. The binaries are self-contained; they install
# themselves from their Settings menu. The archive names must match `asset_url` in
# src/update.rs.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the release

jobs:
  linux:
    # The binary needs at least the glibc of the runner it was built on (2.39 here).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          name="xpaint-${GITHUB_REF_NAME}-x86_64-linux"
          mkdir -p "$name/assets/fonts"
          cp target/release/xpaint README.md LICENSE "$name/"
          cp assets/fonts/DejaVu-LICENSE.txt "$name/assets/fonts/"
          tar -czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: xpaint-*.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked

      # The C runtime is linked statically (.cargo/config.toml), so the exe runs
      # without the Visual C++ redistributable.
      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $name = "xpaint-$env:GITHUB_REF_NAME-x86_64-windows"
          New-Item -ItemType Directory -Path "$name/assets/fonts" | Out-Null
          Copy-Item target/release/xpaint.exe, README.md, LICENSE -Destination $name
          Copy-Item assets/fonts/DejaVu-LICENSE.txt -Destination "$name/assets/fonts"
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: xpaint-*.zip

  release:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" xpaint-*.tar.gz xpaint-*.zip
          --repo "$GITHUB_REPOSITORY"
          --title "xpaint $GITHUB_REF_NAME" --generate-notes
